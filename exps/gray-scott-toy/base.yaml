experiment: gray-scott-toy
seed: 123

shared_dataset:
  variant: default

data_generation:
  # Domain for u=(u,v) and theta=(f,k)
  domain:
    u_bounds:
      - [0, 1]
      - [0, 1]
    theta_bounds:
      - [0.0, 0.3]
      - [0.0, 0.08]
  delta:
    delta_min: 1e-3
    delta_default: 0.20
  train:
    N_obs: 2400
    N_random: 200
    method_theta: uniform
    method_u: uniform
  test:
    N_obs: 800
    N_random: 200
    method_theta: uniform
    method_u: uniform
  outputs:
    out_dir: data
    data_train_npz: gray_scott_toy_data_train.npz
    data_test_npz: gray_scott_toy_data_test.npz

training:
  device: auto
  num_workers: 0
  phi:
    enabled: true
    batch_size: 8192
    epochs: 400
    lr: 1.0e-3
    model:
      embed_dim: 8
      width: [30, 20]
      depth: [4, 3]
    eta:
      scale: 1.5
      cap: 0.01
  approximation_eval:
    enabled: false
    theta_grid: [100, 100]
    u_grid: [50, 50]
    theta_batch_size: 64
    metric_path: approximation_metrics.json
  paths:
    data_dir: data
    out_dir: .
    phi_ckpt: psnn_phi.pt
    compat_phi_ckpt: psnn_final.pt
