inherits: ../../base.yaml

shared_dataset:
  variant: test_1

run:
  variant: test_1_base

data_generation:
  train:
    N_obs: [60, 60]
    N_random: [20, 20]
    method_theta: grid
    method_u: grid
  test:
    N_obs: [60, 60]
    N_random: [20, 20]
    method_theta: grid
    method_u: grid

training:
  phi:
    model:
      width: [30, 30]
  approximation_eval:
    enabled: true
    theta_grid: [100, 100]
    u_grid: [50, 50]
    theta_batch_size: 64
    metric_path: approximation_metrics.json
